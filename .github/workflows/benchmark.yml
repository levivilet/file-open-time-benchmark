name: File-open time benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: file-open-time-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: Open (${{ matrix.editor }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        editor: [lvce, vscode]
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-websocket curl xz-utils xvfb xauth xdotool x11-utils openbox \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
      - name: Install pinned ARM editor
        run: python3 scripts/install.py --editors '${{ matrix.editor }}'
      - name: Measure three fresh-profile Explorer opens
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/benchmark.py --editor '${{ matrix.editor }}'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-${{ matrix.editor }}
          path: results/
          if-no-files-found: error
          retention-days: 90
  diagnose:
    name: Diagnose (${{ matrix.variant }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate, candidate-coalesced]
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-websocket curl xz-utils xvfb xauth xdotool x11-utils openbox \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
      - name: Trace three additional official-package opens
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/diagnose.py --variant '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diagnostic-${{ matrix.variant }}
          path: results/diagnostic/
          if-no-files-found: error
          retention-days: 90
  report:
    name: Tests and complete report
    if: ${{ !cancelled() }}
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests
      - uses: actions/download-artifact@v5
        if: needs.benchmark.result == 'success'
        with:
          pattern: open-*
          path: results/editors
      - name: Build validated report
        if: needs.benchmark.result == 'success'
        run: python3 scripts/report.py --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v5
        if: needs.benchmark.result == 'success'
        with:
          name: measured-report
          path: .tmp/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: needs.benchmark.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tmp/pages
      - name: Require complete editor coverage
        if: needs.benchmark.result != 'success'
        run: exit 1
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
